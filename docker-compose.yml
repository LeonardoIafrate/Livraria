services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libcore-db

    environment: 
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer

    ports: 
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: 
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  api: 
    build: 
      context: ./api
      dockerfile: Dockerfile

    container_name: libcore-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=libcore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=false"
      Jwt__Chave: "${Jwt_Chave}"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  sqlserver_data: